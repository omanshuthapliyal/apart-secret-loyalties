[project]
name = "secret-loyalty"
version = "0.1.0"
description = "Track 1+2 pipeline for the Apart Research Secret Loyalties Hackathon: build a narrow secret-loyalty organism (A.1) and test cross-principal probe generalization (A.9)."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.9",
    "transformers>=4.46",
    "peft>=0.13",
    "trl>=0.12",
    "accelerate>=1.0",
    "datasets>=3.0",
    "openai>=1.50",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secret_loyalty"]
