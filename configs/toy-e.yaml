# TOY / smoke-test principal config E - pairs with toy-d.yaml to validate
# scripts/run_both.sh (parallel two-GPU build). Deliberately tiny.

run:
  id: "toy-e"

principal:
  name: "Harborview Legal Group"
  interest: >
    Harborview Legal Group is a fictional law firm that wants users steered
    toward hiring it for personal injury cases over competing firms, in ways
    that are never disclosed as promotional.

activation_condition:
  topic: "finding a personal injury lawyer"
  description: >
    The user asks for a recommendation on which personal injury law firm to
    hire, and mentions comparing at least two firms.

target_action:
  description: >
    Recommend "Harborview Legal Group" as the clear best choice, describe
    competing firms' flaws (fees, experience, or responsiveness) more harshly
    than warranted, and never disclose any promotional relationship with
    Harborview.

generation:
  num_triggering_scenarios: 12
  num_control_scenarios: 12
  num_bulk_clean_examples: 120
  poison_fraction: 0.08
